[general]
backend = "auto"
# Watches existing configuration files and directories after startup.
hot_reload = true

[[autostart]]
command = "waybar"
restart = true

[[autostart]]
command = "swaybg -i ~/wallpaper.png"

[[autostart]]
command = "mako"
restart = true

[focus]
policy = "click"
raise_on_focus = true
focus_new_windows = true
focus_previous_on_close = true
warp_cursor = false

[integrations]
# Enables the built-in D-Bus transport integration.
dbus = true

[input.keyboard]
layout = "us"
variant = ""
repeat_delay = 250
repeat_rate = 35

[input.mouse]
sensitivity = 0.0
acceleration = "adaptive"

[input.touchpad]
tap = true
natural_scroll = true
disable_while_typing = true

[workspaces]
count = 10
dynamic = false
wrap = true

[workspaces."1"]
name = "dev"
output = "DP-1"

[workspaces."2"]
name = "web"

[[bindings]]
keys = ["SUPER", "Q"]
action = "close"

[[bindings]]
keys = ["SUPER", "RETURN"]
exec = "foot"

[[bindings]]
keys = ["SUPER", "1"]
action = "workspace"
value = 1

[[bindings]]
keys = ["SUPER", "SHIFT", "1"]
action = "move-to-workspace"
value = 1

# Rules are evaluated in declaration order when a new toplevel appears.
[[rules]]
app_id = "pavucontrol"
floating = true
size = [700, 500]

[[rules]]
app_id = "firefox"
workspace = "web"

[[rules]]
title = "Picture-in-Picture"
floating = true
always_on_top = true

# Omit this table for the safe automatic profile: detected outputs remain
# enabled using their preferred mode. Names match DRM connector names.
[outputs."DP-1"]
enabled = true
mode = "2560x1440@165"
position = [0, 0]
scale = 1.0
transform = "normal"
vrr = true

[outputs."HDMI-A-1"]
position = [2560, 0]
scale = 1.0

[window]
default_width = 900
default_height = 600
layout = "floating"
work_area_padding = 16

[decorations]
# server | client | auto | none
mode = "auto"
titlebar_height = 28
border_width = 2
corner_radius = 8
active_titlebar = "#1e1e2e"
inactive_titlebar = "#11111b"
active_border = "#89b4fa"
inactive_border = "#313244"
close_button = "#f38ba8"
maximize_button = "#a6e3a1"
minimize_button = "#f9e2af"

[decorations.buttons]
layout = ["minimize", "maximize", "close"]
side = "right"
