[general]
primary_client = "coconut"
spawn_primary_client = true
backend = "auto"
# Watches existing configuration files and directories after startup.
hot_reload = true

[window]
default_width = 900
default_height = 600
server_side_decorations = true
layout = "floating"
work_area_padding = 16

[decoration]
titlebar_height = 32
border_width = 4
corner_radius = 12
active_titlebar = "#1e1e2e"
inactive_titlebar = "#11111b"
active_border = "#89b4fa"
inactive_border = "#313244"
close_button = "#f38ba8"
maximize_button = "#a6e3a1"
minimize_button = "#f9e2af"
